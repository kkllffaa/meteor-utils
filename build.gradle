plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "com.diffplug.spotless" version "6.25.0"
}


version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

java {
	sourceCompatibility = targetCompatibility = JavaVersion.VERSION_25
}

repositories {
	mavenCentral()
	maven { url = "https://maven.meteordev.org/releases" }
	maven { url = "https://maven.meteordev.org/snapshots" }
}


dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Meteor
	implementation "meteordevelopment:meteor-client:${project.minecraft_version}-SNAPSHOT"
}

processResources {
	filesMatching("fabric.mod.json") {
		expand "version": project.version, "mc_version": project.minecraft_version
	}
}

spotless {
	java {
		target "src/**/*.java"

		eclipse().configFile("eclipse-formatter.xml")

		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
}
tasks.register("printVersion") {
	doLast {
		println(project.version)
	}
}
tasks.register("printMCVersion") {
	doLast {
		println(project.minecraft_version)
	}
}
